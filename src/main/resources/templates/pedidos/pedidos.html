<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madame Moka - Carrinho</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <nav class="navbar">

        <div class="container">

            <a th:href="@{/}" class="logo">

                <img th:src="@{/img/logo.png}"
                     alt="Madame Moka">

            </a>


            <ul class="nav-menu">

                <li>

                    <a th:href="@{/}">
                        Home
                    </a>

                </li>


                <li>

                    <a th:href="@{/produtos}">
                        Produtos
                    </a>

                </li>


                <li>

                    <a th:href="@{/pedidos}">
                        🛒 Carrinho
                        <span id="quantidadeCarrinho">0</span>
                    </a>

                </li>


                <li>

                    <a th:href="@{/perfil}"
                       title="Meu Perfil">

                        👤

                    </a>

                </li>

            </ul>

        </div>

    </nav>

</header>



<!-- ================= CARRINHO ================= -->

<section class="menu">

    <div class="container">

        <h2>Meu Carrinho</h2>


        <div id="listaCarrinho"></div>


        <h3 id="totalCarrinho"></h3>

    </div>

</section>



<!-- ================= SCRIPT ================= -->

<script>


    // ================= CARREGAR CARRINHO =================

    function carregarCarrinho() {

        let carrinho =
            JSON.parse(localStorage.getItem("carrinho")) || [];


        let lista =
            document.getElementById("listaCarrinho");


        let total = 0;

        let quantidadeTotal = 0;


        lista.innerHTML = "";



        // ================= CARRINHO VAZIO =================

        if (carrinho.length === 0) {

            lista.innerHTML =
                '<p class="carrinho-vazio">Seu carrinho está vazio.</p>';


            document.getElementById("totalCarrinho").textContent = "";


            document.getElementById("quantidadeCarrinho").textContent = "0";


            return;
        }



        // ================= PRODUTOS =================

        carrinho.forEach((produto, index) => {


            let subtotal =
                produto.preco * produto.quantidade;


            total += subtotal;


            quantidadeTotal += produto.quantidade;



            let item =
                document.createElement("div");


            item.className =
                "menu-item";



            item.innerHTML = `

                <h3>
                    ${produto.nome}
                </h3>


                <p>
                    Quantidade: ${produto.quantidade}
                </p>


                <p>
                    Preço: R$ ${produto.preco
                        .toFixed(2)
                        .replace(".", ",")}
                </p>


                <p>
                    Subtotal: R$ ${subtotal
                        .toFixed(2)
                        .replace(".", ",")}
                </p>


                <button
                    class="btn-carrinho"
                    onclick="removerProduto(${index})">

                    Remover

                </button>

            `;


            lista.appendChild(item);

        });



        // ================= QUANTIDADE =================

        document.getElementById("quantidadeCarrinho").textContent =
            quantidadeTotal;



        // ================= TOTAL =================

        document.getElementById("totalCarrinho").textContent =
            "Total: R$ " +
            total.toFixed(2).replace(".", ",");

    }



    // ================= REMOVER PRODUTO =================

    function removerProduto(index) {

        let carrinho =
            JSON.parse(localStorage.getItem("carrinho")) || [];


        carrinho.splice(index, 1);


        localStorage.setItem(
            "carrinho",
            JSON.stringify(carrinho)
        );


        carregarCarrinho();

    }



    // ================= INICIAR =================

    carregarCarrinho();


</script>


</body>

</html>
